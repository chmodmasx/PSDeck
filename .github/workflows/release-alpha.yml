name: Publish alpha release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build Decky frontend
        run: pnpm build

      - name: Package plugin
        run: |
          rm -rf release
          mkdir -p release/PSDeck/dist
          cp dist/index.js release/PSDeck/dist/index.js
          cp package.json plugin.json README.md LICENSE release/PSDeck/
          (
            cd release
            zip -r ../PSDeck-Decky.zip PSDeck
          )

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"

          cat > release-notes.md <<'EOF'
          PS Vita Home milestone.

          Included:
          - PSDeck-Decky.zip

          New in this alpha:
          - PS Vita-style 3-4-3 Home layout
          - up to 10 bubbles per page and 10 vertical pages
          - installed Steam games and non-Steam shortcuts appear directly on Home
          - recently played games are ordered first
          - image-based Vita-inspired system bubbles
          - Steam artwork for game bubbles with local-cache-first fallbacks
          - spatial D-pad / stick navigation across the 3-4-3 geometry
          - vertical page changes with the controller
          - touchscreen bubble activation
          - vertical touchscreen swipe between Home pages
          - touchable page indicators
          - touchable LiveArea back control and gate
          - LiveArea gate launches real Steam games through SteamClient.Apps.RunGame
          - image-based LiveArea with game artwork

          Still pending direct Steam route mapping:
          - Settings
          - Downloads
          - Media

          Sony firmware artwork is not distributed. PSDeck's bundled system artwork is original Vita-inspired artwork.

          CSS Loader remains intentionally deferred until the shell is stable on hardware.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PSDeck-Decky.zip --clobber
          else
            gh release create "$TAG"               PSDeck-Decky.zip               --target "${GITHUB_SHA}"               --title "PSDeck $TAG"               --notes-file release-notes.md               --prerelease
          fi
